<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script src="auth.js"></script>

  <style>
    body { font-family: Arial; margin: 0; }
    header {
      background: #ff6b6b;
      color: white;
      padding: 15px;
      position: relative;
      text-align: center;
    }

    #logoutBtn {
      position: absolute;
      right: 15px;
      top: 10px;
      background: black;
      color: white;
      padding: 8px;
      border: none;
      cursor: pointer;
    }

    #menu {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body onload="protectPage()">

<header>
  <h2>🍓 Fruitizzzz Dashboard</h2>
  <button id="logoutBtn" onclick="logout()">Logout</button>
</header>

<div id="menu">Loading...</div>

<script>
const API = "https://fruitizzzz-backend.onrender.com/api/menu";

let menuData = [];

fetch(API)
  .then(res => res.json())
  .then(data => {
    menuData = data;

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>
        <button onclick="addToCart('${item._id}')">Add to Cart</button>
      `;

      menu.appendChild(div);
    });
  });

function addToCart(id) {
  const item = menuData.find(m => m._id === id);
  alert(item.name + " added to cart");
}
</script>

</body>
</html>
