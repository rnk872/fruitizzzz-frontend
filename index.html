<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body onload="protectPage()">

<header>
  <h2>🍓 Fruitizzzz Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div id="menu">Loading...</div>

<script src="auth.js"></script>

<script>
const API = "https://fruitizzzz-backend.onrender.com/api/menu";

let menuData = [];

fetch(API)
  .then(res => res.json())
  .then(data => {
    menuData = data;

    const menu = document.getElementById("menu");
    menu.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>
        <button onclick="addToCart('${item._id}')">Add</button>
      `;

      menu.appendChild(div);
    });
  });

function addToCart(id) {
  const item = menuData.find(m => m._id === id);
  alert(item.name + " added");
}
</script>

</body>
</html>
